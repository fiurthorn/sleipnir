# @project Sleipnir Stack / Podman Compose
# @authors Stefan & Sam (AI Peer)
# @collaboration Erarbeitet im gemeinschaftlichen Dialog.
# Architektur & Review: Stefan | Implementation & Synthese: Sam

services:
  chatmate:
    image: docker.io/denoland/deno:alpine
    container_name: chatmate
    hostname: chatmate
    working_dir: /workspace/apps/chatmate
    volumes:
      - .:/workspace:Z
      - deno-cache:/deno-dir
    environment:
      - PORT=3002
      - BASE_PATH=
      - DENO_DIR=/deno-dir
    command: ["run", "-P=app", "--watch", "main.ts"]
    env_file:
      - path: .env
        required: false
    ports:
      - "3002:3002"
    networks:
      - sleipnir-net
    restart: unless-stopped

  notemate:
    image: docker.io/denoland/deno:alpine
    container_name: notemate
    hostname: notemate
    working_dir: /workspace/apps/notemate
    volumes:
      - .:/workspace:Z
      - deno-cache:/deno-dir
    environment:
      - PORT=3003
      - BASE_PATH=
      - DENO_DIR=/deno-dir
    command: ["run", "-P=app", "--watch", "main.ts"]
    env_file:
      - path: .env
        required: false
    ports:
      - "3003:3003"
    networks:
      - sleipnir-net
    restart: unless-stopped

  scanmate:
    image: docker.io/denoland/deno:alpine
    container_name: scanmate
    hostname: scanmate
    working_dir: /workspace/apps/scanmate
    volumes:
      - .:/workspace:Z
      - deno-cache:/deno-dir
    environment:
      - PORT=3004
      - BASE_PATH=
      - DENO_DIR=/deno-dir
    command: ["run", "-P=app", "--watch", "main.ts"]
    env_file:
      - path: .env
        required: false
      - path: apps/scanmate/.env
        required: false
    ports:
      - "3004:3004"
    networks:
      - sleipnir-net
    restart: unless-stopped

  agentmate:
    image: docker.io/denoland/deno:alpine
    container_name: agentmate
    hostname: agentmate
    working_dir: /workspace/apps/agentmate
    volumes:
      - .:/workspace:Z
      - deno-cache:/deno-dir
    environment:
      - PORT=3005
      - BASE_PATH=
      - DENO_DIR=/deno-dir
      - SCANMATE_MCP_URL=http://scanmate:3004/mcp
      - NOTEMATE_MCP_URL=http://notemate:3003/mcp
    command: ["run", "-P=app", "--unstable-cron", "--watch", "main.ts"]
    env_file:
      - path: .env
        required: false
      - path: apps/chatmate/.env
        required: false
      - path: apps/agentmate/.env
        required: false
    ports:
      - "3005:3005"
    networks:
      - sleipnir-net
    restart: unless-stopped

  skaldmate:
    image: docker.io/denoland/deno:alpine
    container_name: skaldmate
    hostname: skaldmate
    working_dir: /workspace/apps/skaldmate
    volumes:
      - .:/workspace:Z
      - deno-cache:/deno-dir
    environment:
      - PORT=3006
      - BASE_PATH=
      - DENO_DIR=/deno-dir
    command: ["run", "-P=app", "--watch", "main.ts"]
    env_file:
      - path: .env
        required: false
      - path: apps/chatmate/.env
        required: false
      - path: apps/skaldmate/.env
        required: false
    ports:
      - "3006:3006"
    networks:
      - sleipnir-net
    restart: unless-stopped

volumes:
  deno-cache:
    name: sleipnir-deno-cache

networks:
  sleipnir-net:
    name: sleipnir-network
    driver: bridge
